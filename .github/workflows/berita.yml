name: Rangkuman berita harian
on:
  schedule:
    - cron: "47 22 * * *"   # 05.47 WIB
    - cron: "17 23 * * *"   # 06.17 WIB
    - cron: "47 23 * * *"   # 06.47 WIB
  workflow_dispatch: {}     # tombol "Run workflow" untuk coba manual
permissions:
  contents: write
jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser requests
      - run: python scripts/berita_harian.py
      - name: Simpan hasil
        run: |
          git config user.name "berita-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/berita.json
          git diff --cached --quiet || (git commit -m "Update berita" && git push)
